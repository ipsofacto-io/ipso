version: 2

project_name: ipso

builds:
  - id: ipso
    main: ./cmd/ipso
    binary: ipso
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ipsofacto-io/ipso/internal/cli.Version={{ .Version }}
      - -X github.com/ipsofacto-io/ipso/internal/cli.Commit={{ .Commit }}
      - -X github.com/ipsofacto-io/ipso/internal/cli.Date={{ .Date }}

archives:
  - id: ipso
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  mode: append
  github:
    owner: ipsofacto-io
    name: ipso

# A cask, because GoReleaser deprecates formulas that install a pre-built binary (ADR-0079). The
# binary is not notarized, so on macOS the hook clears the quarantine flag that Homebrew sets on a
# cask download. A formula install of the same binary is not quarantined either.
homebrew_casks:
  - name: ipso
    binaries: [ipso]
    repository:
      owner: ipsofacto-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: "{{ .Env.SKIP_HOMEBREW }}"
    directory: Casks
    homepage: https://ipsoplatform.io
    description: CLI that validates engineering decision records
    commit_author:
      name: Luca Bertelli
      email: bertelli.luca@proton.me
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ipso"]
          end

dockers_v2:
  - ids:
      - ipso
    dockerfile: Dockerfile
    images:
      - ghcr.io/ipsofacto-io/ipso
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "false"
    labels:
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.source: https://github.com/ipsofacto-io/ipso
