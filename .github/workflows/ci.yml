name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  hook-latency:
    name: ci / hook-latency
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Hold the PreToolUse path under 300 ms at p95
        run: go test ./internal/cli -run TestHookLatency -count=1 -v
        env:
          IPSO_HOOK_LATENCY: "1"

  bundle:
    name: ci / bundle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install cosign
        run: |
          set -euo pipefail
          version="3.1.4"
          binary="cosign-linux-amd64"
          checksum="424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
          url="https://github.com/sigstore/cosign/releases/download/v${version}/${binary}"
          tmp="${RUNNER_TEMP}/cosign-install"
          mkdir -p "${tmp}/bin"
          curl -fsSL -o "${tmp}/bin/cosign" "$url"
          echo "${checksum}  ${tmp}/bin/cosign" | sha256sum -c -
          chmod 0755 "${tmp}/bin/cosign"
          echo "${tmp}/bin" >> "$GITHUB_PATH"
      - run: go test -tags cosign ./internal/bundle

  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  licenses:
    name: ci / licenses
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: go-licenses check ./cmd/ipso --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  release:
    name: ci / release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - name: Check GoReleaser config
        run: |
          set -euo pipefail
          set +e
          goreleaser check
          code="$?"
          set -e
          # Exit 2 means the config is valid and uses the formula publisher.
          # GoReleaser 2.18 deprecates formulas in favor of casks. The tap
          # install is `brew install ipsofacto-io/tap/ipso`, which is a formula.
          if [ "$code" -eq 2 ]; then
            exit 0
          fi
          exit "$code"

  depcruise:
    name: ci / depcruise
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/compiler/depcruise/testdata/tool/package-lock.json
      - name: Install dependency-cruiser
        working-directory: internal/compiler/depcruise/testdata/tool
        run: npm ci --ignore-scripts
      - name: Cruise the fixture monorepo
        run: go test ./internal/compiler/depcruise -count=1
        env:
          IPSO_DEPCRUISE: ${{ github.workspace }}/internal/compiler/depcruise/testdata/tool/node_modules/.bin/dependency-cruiser

  semgrep-fixtures:
    name: ci / semgrep-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: internal/compiler/semgrep/testdata/tool/requirements.txt
      - name: Install Semgrep
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/pip" install --require-hashes --no-deps -r internal/compiler/semgrep/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/semgrep/bin" >> "$GITHUB_PATH"
      - name: Test Semgrep fixtures
        run: go test ./internal/compiler/semgrep -count=1
        env:
          IPSO_SEMGREP: "1"

  archunit:
    name: ci / archunit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install ArchUnit
        run: bash internal/compiler/archunit/testdata/tool/install.sh
      - name: Evaluate the fixture subjects
        run: go test ./internal/compiler/archunit ./internal/cli -count=1
        env:
          IPSO_ARCHUNIT: "1"

  importlinter:
    name: ci / importlinter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: internal/compiler/importlinter/testdata/tool/requirements.txt
      - name: Install import-linter
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/importlinter"
          "${RUNNER_TEMP}/importlinter/bin/pip" install --require-hashes --no-deps -r internal/compiler/importlinter/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/importlinter/bin" >> "$GITHUB_PATH"
      - name: Evaluate the fixture subjects
        run: go test ./internal/compiler/importlinter ./internal/cli -count=1
        env:
          IPSO_IMPORTLINTER: "1"

  kyverno:
    name: ci / kyverno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Kyverno
        run: |
          set -euo pipefail
          bash internal/compiler/kyverno/testdata/tool/install.sh
          echo "${GITHUB_WORKSPACE}/internal/compiler/kyverno/testdata/tool/bin" >> "$GITHUB_PATH"
      - name: Evaluate the fixture subjects
        run: go test ./internal/compiler/kyverno ./internal/cli -count=1
        env:
          IPSO_KYVERNO: "1"

  gatekeeper:
    name: ci / gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gator
        run: |
          set -euo pipefail
          bash internal/compiler/opa/testdata/tool/install.sh
          echo "${GITHUB_WORKSPACE}/internal/compiler/opa/testdata/tool/bin" >> "$GITHUB_PATH"
      - name: Evaluate the fixture subjects
        run: go test ./internal/compiler/gatekeeper ./internal/cli -count=1
        env:
          IPSO_GATEKEEPER: "1"

  render:
    name: ci / render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the render tools and the engines
        run: |
          set -euo pipefail
          bash internal/render/testdata/tool/install.sh
          bash internal/compiler/kyverno/testdata/tool/install.sh
          bash internal/compiler/opa/testdata/tool/install.sh
          {
            echo "${GITHUB_WORKSPACE}/internal/render/testdata/tool/bin"
            echo "${GITHUB_WORKSPACE}/internal/compiler/kyverno/testdata/tool/bin"
            echo "${GITHUB_WORKSPACE}/internal/compiler/opa/testdata/tool/bin"
          } >> "$GITHUB_PATH"
      - name: Render and evaluate the fixtures
        run: go test ./internal/render ./internal/cli -run 'Render|Pinned|Sandbox' -count=1
        env:
          IPSO_RENDER: "1"

  eslint:
    name: ci / eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/compiler/eslint/testdata/tool/package-lock.json
      - name: Install ESLint
        working-directory: internal/compiler/eslint/testdata/tool
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          echo "${GITHUB_WORKSPACE}/internal/compiler/eslint/testdata/tool/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Evaluate the fixture subjects
        run: go test ./internal/compiler/eslint ./internal/cli -count=1
        env:
          IPSO_ESLINT: "1"

  conformance:
    name: ci / conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            internal/compiler/depcruise/testdata/tool/package-lock.json
            internal/compiler/eslint/testdata/tool/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            internal/compiler/semgrep/testdata/tool/requirements.txt
            internal/compiler/importlinter/testdata/tool/requirements.txt
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependency-cruiser
        working-directory: internal/compiler/depcruise/testdata/tool
        run: npm ci --ignore-scripts
      - name: Install Semgrep
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/pip" install --require-hashes --no-deps -r internal/compiler/semgrep/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/semgrep/bin" >> "$GITHUB_PATH"
      - name: Install ArchUnit
        run: bash internal/compiler/archunit/testdata/tool/install.sh
      - name: Install import-linter
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/importlinter"
          "${RUNNER_TEMP}/importlinter/bin/pip" install --require-hashes --no-deps -r internal/compiler/importlinter/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/importlinter/bin" >> "$GITHUB_PATH"
      - name: Install ESLint
        working-directory: internal/compiler/eslint/testdata/tool
        run: npm ci --ignore-scripts
      - name: Install Kyverno
        run: bash internal/compiler/kyverno/testdata/tool/install.sh
      - name: Install gator
        run: bash internal/compiler/opa/testdata/tool/install.sh
      - name: Run the conformance suite
        run: go test -tags conformance ./internal/compiler/conformance -count=1
