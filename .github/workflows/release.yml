name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      sign-tag:
        description: Existing tag to sign without building. Leave empty to build the tag this run is on.
        required: false
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: release / conformance
    # A build runs on a tag. A dispatch on a branch builds nothing, and signing runs no conformance.
    if: startsWith(github.ref, 'refs/tags/v') && inputs.sign-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            internal/compiler/depcruise/testdata/tool/package-lock.json
            internal/compiler/eslint/testdata/tool/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            internal/compiler/semgrep/testdata/tool/requirements.txt
            internal/compiler/importlinter/testdata/tool/requirements.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependency-cruiser
        working-directory: internal/compiler/depcruise/testdata/tool
        run: npm ci --ignore-scripts
      - name: Install Semgrep
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/pip" install --require-hashes --no-deps -r internal/compiler/semgrep/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/semgrep/bin" >> "$GITHUB_PATH"
      - name: Install ArchUnit
        run: bash internal/compiler/archunit/testdata/tool/install.sh
      - name: Install import-linter
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/importlinter"
          "${RUNNER_TEMP}/importlinter/bin/pip" install --require-hashes --no-deps -r internal/compiler/importlinter/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/importlinter/bin" >> "$GITHUB_PATH"
      - name: Install ESLint
        working-directory: internal/compiler/eslint/testdata/tool
        run: npm ci --ignore-scripts
      - name: Install Kyverno
        run: bash internal/compiler/kyverno/testdata/tool/install.sh
      - name: Install gator
        run: bash internal/compiler/opa/testdata/tool/install.sh
      - name: Run the conformance suite
        run: go test -tags conformance ./internal/compiler/conformance -count=1

  release:
    needs: conformance
    # Only signing may go ahead without conformance, because a skipped job is also what a dispatch on a
    # branch produces, and that must not publish.
    if: >-
      always() && (
        (inputs.sign-tag == '' && needs.conformance.result == 'success') ||
        (inputs.sign-tag != '' && needs.conformance.result == 'skipped')
      )
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ipsofacto-io/.github/.github/workflows/release-cli.yml@eed4a1c19f43cfbe2faaa7ad5575ce43dc0abcff
    with:
      ref: ${{ inputs.sign-tag || github.ref }}
      tag: ${{ inputs.sign-tag || github.ref_name }}
      sign-only: ${{ inputs.sign-tag != '' }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
